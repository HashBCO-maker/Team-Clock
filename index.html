<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>Team Clock</title>
<style>
  :root {
    --bg: rgba(22, 24, 30, 0.97);
    --border: rgba(255, 255, 255, 0.08);
    --text: #f2f3f5;
    --muted: #9aa0ab;
    --faint: rgba(255, 255, 255, 0.06);
    --work: #3ecf8e;
    --off: #6b7280;
    --accent: #7aa2ff;
  }
  body.light {
    --bg: rgba(250, 250, 252, 0.98);
    --border: rgba(0, 0, 0, 0.08);
    --text: #16181d;
    --muted: #5f6470;
    --faint: rgba(0, 0, 0, 0.05);
    --work: #12a46a;
    --off: #a3a8b3;
    --accent: #3461e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    padding: 6px;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    padding: 10px 14px 8px;
    -webkit-app-region: drag;
    cursor: default;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); padding-bottom: 6px;
  }
  .menu {
    -webkit-app-region: no-drag;
    background: none; border: none; color: var(--muted);
    font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px; cursor: pointer;
  }
  .menu:hover { background: var(--faint); color: var(--text); }
  .row {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    padding: 8px 0; border-top: 1px solid var(--border);
  }
  .row:first-of-type { border-top: none; }
  .city { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.work { background: var(--work); box-shadow: 0 0 6px var(--work); }
  .region { font-size: 10px; font-weight: 500; color: var(--muted); }
  .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .time {
    font-size: 24px; font-weight: 300; text-align: right;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .time .sec { font-size: 14px; color: var(--muted); }
  .time .ampm { font-size: 11px; color: var(--muted); margin-left: 3px; }
  .day { font-size: 11px; color: var(--muted); text-align: right; margin-top: 1px; }
  .day.diff { color: var(--accent); }
  footer { font-size: 10px; color: var(--muted); text-align: center; padding-top: 4px; }
</style>
</head>
<body>
<div class="card" id="card">
  <header>
    <span>Team Clock</span>
    <button class="menu" id="menu" title="Settings">&#8943;</button>
  </header>
  <div id="rows"></div>
  <footer id="footer"></footer>
</div>

<script>
  // ===== Edit this list to change the cities shown =====
  // "tz" must be an IANA time zone name, e.g. "Asia/Singapore", "Europe/London".
  const zones = [
    { city: 'Melbourne', region: 'VIC', tz: 'Australia/Melbourne' },
    { city: 'Brisbane',  region: 'QLD', tz: 'Australia/Brisbane' },
    { city: 'Adelaide',  region: 'SA',  tz: 'Australia/Adelaide' },
    { city: 'Colombo',   region: 'LK',  tz: 'Asia/Colombo' }
  ];
  let settings = { hour12: false, showSeconds: true, theme: 'dark' };

  const partsFmt = {};
  function parts(tz, date) {
    partsFmt[tz] ||= new Intl.DateTimeFormat('en-AU', {
      timeZone: tz, hourCycle: 'h23',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short'
    });
    const o = {};
    for (const p of partsFmt[tz].formatToParts(date)) o[p.type] = p.value;
    return o;
  }

  // Offset from UTC in minutes for a zone at a given instant (handles daylight saving).
  function offsetMinutes(tz, date) {
    const p = parts(tz, date);
    const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
    return Math.round((asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000);
  }

  function fmtOffset(mins, withUtc) {
    const sign = mins < 0 ? '−' : '+';
    const a = Math.abs(mins), h = Math.floor(a / 60), m = a % 60;
    const s = m ? `${h}:${String(m).padStart(2, '0')}` : `${h}`;
    return withUtc ? `UTC${sign}${s}` : `${sign}${s}h`;
  }

  function relLabel(diff) {
    if (diff === 0) return 'same as you';
    const a = Math.abs(diff), h = Math.floor(a / 60), m = a % 60;
    const s = (h ? `${h}h` : '') + (m ? `${h ? ' ' : ''}${m}m` : '');
    return diff > 0 ? `${s} ahead` : `${s} behind`;
  }

  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = zones.map((z, i) => `
    <div class="row">
      <div>
        <div class="city"><span class="dot" id="dot${i}"></span>${z.city}<span class="region">${z.region || ''}</span></div>
        <div class="meta" id="meta${i}"></div>
      </div>
      <div>
        <div class="time" id="time${i}"></div>
        <div class="day" id="day${i}"></div>
      </div>
    </div>`).join('');

  function render() {
    const now = new Date();
    const localOff = -now.getTimezoneOffset();
    const localDay = now.toLocaleDateString('en-CA');

    zones.forEach((z, i) => {
      const p = parts(z.tz, now);
      const off = offsetMinutes(z.tz, now);
      let h = +p.hour % 24;
      const mm = p.minute, ss = p.second;

      let hh, ampm = '';
      if (settings.hour12) {
        ampm = h < 12 ? 'am' : 'pm';
        hh = String(h % 12 || 12);
      } else {
        hh = String(h).padStart(2, '0');
      }
      document.getElementById('time' + i).innerHTML =
        `${hh}:${mm}` +
        (settings.showSeconds ? `<span class="sec">:${ss}</span>` : '') +
        (ampm ? `<span class="ampm">${ampm}</span>` : '');

      const zoneDay = `${p.year}-${p.month}-${p.day}`;
      const dayEl = document.getElementById('day' + i);
      let dayText = `${p.weekday} ${+p.day} ${new Date(Date.UTC(+p.year, +p.month - 1, 1)).toLocaleString('en-AU', { month: 'short', timeZone: 'UTC' })}`;
      if (zoneDay > localDay) dayText = 'Tomorrow · ' + dayText;
      else if (zoneDay < localDay) dayText = 'Yesterday · ' + dayText;
      dayEl.textContent = dayText;
      dayEl.classList.toggle('diff', zoneDay !== localDay);

      document.getElementById('meta' + i).textContent =
        `${fmtOffset(off, true)} · ${relLabel(off - localOff)}`;

      const weekday = !['Sat', 'Sun'].includes(p.weekday);
      const working = weekday && h >= 9 && h < 17;
      const dot = document.getElementById('dot' + i);
      dot.classList.toggle('work', working);
      dot.title = working ? 'Working hours (Mon–Fri 9–5)' : 'Outside working hours';
    });

    document.getElementById('footer').textContent =
      'Green dot = working hours (Mon–Fri 9am–5pm)';
  }

  function applySettings(s) {
    settings = { ...settings, ...s };
    document.body.classList.toggle('light', settings.theme === 'light');
    render();
    fit();
  }

  function fit() {
    if (!window.widget) return;
    requestAnimationFrame(() => {
      window.widget.fitHeight(document.getElementById('card').offsetHeight + 12);
    });
  }

  function tick() {
    render();
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }

  if (window.widget) {
    window.widget.getSettings().then(applySettings);
    window.widget.onSettings(applySettings);
    document.getElementById('menu').addEventListener('click', () => window.widget.openMenu());
  } else {
    // Plain browser preview: toggle theme with the menu button.
    document.getElementById('menu').addEventListener('click', () =>
      applySettings({ theme: settings.theme === 'dark' ? 'light' : 'dark' }));
  }

  render();
  fit();
  tick();
</script>
</body>
</html>
